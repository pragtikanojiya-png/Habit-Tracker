<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌟 Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Habit Tracker</h1>

    <div class="stats">
      <span id="totalHabits">Total: 0</span>
      <span id="completedHabits">Completed: 0</span>
    </div>

    <div class="input-group">
      <input type="text" id="habitInput" placeholder="Add a new habit...">
      <button onclick="addHabit()">➕ Add</button>
    </div>

    <ul id="habitList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
